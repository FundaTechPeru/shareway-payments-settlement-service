spring.datasource.url=jdbc:h2:mem:payment_settlement_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test-only-shareway-jwt-secret-with-at-least-32-bytes
app.internal.api-key=test-internal-api-key
app.settlement.commission-rate=0.15
app.penalty.rate=0.50
app.penalty.window-minutes=30
