spring.application.name=payment-settlement-service
server.port=${SERVER_PORT:8085}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/payment_settlement_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shareway}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shareway}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

app.jwt.secret=${JWT_SECRET:dev-only-shareway-driver-management-secret-change-me}
app.internal.api-key=${INTERNAL_API_KEY:dev-only-shareway-internal-api-key}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.settlement.commission-rate=${COMMISSION_RATE:0.15}
app.penalty.rate=${PENALTY_RATE:0.50}
app.penalty.window-minutes=${PENALTY_WINDOW_MINUTES:30}
