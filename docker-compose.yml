services:
  db:
    image: postgres:16
    container_name: payment-settlement-db
    environment:
      POSTGRES_DB: payment_settlement_db
      POSTGRES_USER: shareway
      POSTGRES_PASSWORD: shareway
    ports:
      - "5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shareway -d payment_settlement_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: payment-settlement-service
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/payment_settlement_db
      SPRING_DATASOURCE_USERNAME: shareway
      SPRING_DATASOURCE_PASSWORD: shareway
      JWT_SECRET: ${JWT_SECRET:-dev-only-shareway-driver-management-secret-change-me}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-only-shareway-internal-api-key}
    ports:
      - "8085:8085"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
